[package]
name = "otter_core"
version = "0.2.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
jieba-rs = "0.11.0"
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hmac = "0.13.0"
regex = "1.13.1"
pulldown-cmark = "0.13.6"
scraper = "0.29.0"
roxmltree = "0.21.2"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
png = "0.18.1"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-script = "0.5.8"
self_cell = "1.3.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "query", "http2", "socks", "system-proxy"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = "0.3.34"
base64 = "0.23.1"
# 已随 rustls 编入；备份凭据加密复用它的 PBKDF2、AES-256-GCM 与系统随机数。
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "alloc"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
