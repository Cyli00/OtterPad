name: otter_pad
description: "A cross-platform reading app inspired by Zotero, built with Flutter and Material Design 3."
publish_to: 'none'
version: 0.2.0+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 声明式路由
  go_router: ^17.1.0

  # 网络
  dio: ^5.9.0



  # Material You 动态取色
  dynamic_color: ^1.7.0

  # 文件/路径
  path_provider: ^2.1.5
  path: ^1.9.1
  # 桌面原生系统字体枚举（不修改平台工程）
  ffi: ^2.2.0

  # Rust 后端（rust/，由 rust_builder 的 cargokit 随 flutter build 编译）
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  otter_core:
    path: rust_builder


  # WebDAV 同步
  webdav_client: ^1.2.2

  # 分享
  share_plus: ^10.0.0


  # App 信息
  package_info_plus: ^9.0.1

  # 日志
  logger: ^2.5.0

  # 国际化
  intl: ^0.20.0



  # SVG
  flutter_svg: ^2.0.14

  # URL 跳转
  url_launcher: ^6.3.1
  crypto: ^3.0.7

  # 设备系统版本（Android RELEASE 等，避免误读 Build.DISPLAY）
  # 13.x 依赖 win32 ^6，与当前 package_info_plus 的 win32 ^5 冲突
  device_info_plus: ^12.4.0

  # 文件选择
  file_picker: ^8.1.7

  # 应用内触发 APK 安装（自更新）
  open_filex: ^4.7.0

  flutter_widget_from_html_core: ^0.17.0
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  markdown_widget: ^2.3.2+8
  html: ^0.15.6
  animations: ^3.0.0
  # 弹簧物理引擎：按压回弹 / 勾选弹出 / 面板开合（见 lib/core/animation_constants.dart）
  motor: ^1.1.0


  # Material Symbols (3000+ icons, drop-in replacement for Icons.*)
  material_symbols_icons: ^4.2928.1

  # 桌面端自定义标题栏（隐藏原生 title bar + 窗口控制）
  window_manager: ^0.5.1

  # 桌面端主显示器分辨率查询（窗口最小尺寸推导）。window_manager 的传递依赖，
  # 但代码直接 import，故显式声明
  screen_retriever: ^0.2.2

  # 桌面拖入 PDF。^0.7.1 = ≥0.7.1 <0.8.0，不会漂到 0.8.0（后者要求 AGP 9；本仓 AGP 8.11.1 且禁止改 android/）
  desktop_drop: ^0.7.1

  # 图表查看器：手势缩放、下滑关闭与 Hero 回位
  extended_image: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.0
  freezed: ^3.2.5


  # 图标生成
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/config/

