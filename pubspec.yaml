name: otter_pad
description: "A cross-platform reading app inspired by Zotero, built with Flutter and Material Design 3."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.2.1

  # 声明式路由
  go_router: ^17.1.0

  # 动画
  flutter_animate: ^4.5.2

  # 偏好存储
  # 网络
  dio: ^5.9.0
  dio_http2_adapter: ^2.7.1
  connectivity_plus: ^6.0.0
  pdfrx: ^2.2.24


  # 键值存储（设置/偏好）
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 凭据安全存储（API key / secret / 密码），后端走各平台 Keystore/Keychain/DPAPI
  flutter_secure_storage: ^10.3.1

  # Material You 动态取色
  dynamic_color: ^1.7.0

  # 文件/路径
  path_provider: ^2.1.5
  path: ^1.9.1

  # 图片缓存
  cached_network_image: ^3.4.1

  # WebDAV 同步
  webdav_client: ^1.2.2

  # 分享
  share_plus: ^10.0.0

  # 剪贴板（桌面端图片复制）
  pasteboard: ^0.5.0

  # App 信息
  package_info_plus: ^8.0.0

  # Toast / Dialog
  flutter_smart_dialog: ^4.9.8

  # 日志
  logger: ^2.5.0

  # 国际化
  intl: ^0.20.0

  # JSON 序列化（运行时）
  json_annotation: ^4.9.0

  # Zip/EPUB 解压
  archive: ^4.0.2

  # SVG
  flutter_svg: ^2.0.14

  # URL 跳转
  url_launcher: ^6.3.1
  crypto: ^3.0.7

  # 文件选择
  file_picker: ^8.1.7

  # XML 解析（arXiv API 响应）
  xml: ^6.6.0
  flutter_widget_from_html_core: ^0.17.0
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  markdown_widget: ^2.3.2+8
  html: ^0.15.6
  animations: ^2.1.2

  # WebView 阅读器（Markdown 渲染 + 多段落选择 + 标注）
  flutter_inappwebview: ^6.1.5
  extended_image: ^10.0.1

  # Material Symbols (3000+ icons, drop-in replacement for Icons.*)
  material_symbols_icons: ^4.2928.1

  # 桌面端自定义标题栏（隐藏原生 title bar + 窗口控制）
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.0
  json_serializable: ^6.8.0


  # 图标生成
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
    # KaTeX 离线资源（CSS/JS/字体），由 ReaderLocalhostServer 的
    # /_assets/* 路由从 rootBundle 服务，零网络依赖。
    - assets/katex/
    - assets/katex/contrib/
    - assets/katex/fonts/
    # 阅读器静态 JS/CSS，同走 /_assets/* 路由（见 webview_reader_html）。
    - assets/reader/

  fonts:
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
