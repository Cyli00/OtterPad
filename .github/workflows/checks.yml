name: 发布检查

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.checks.outputs.version }}
      build-number:
        value: ${{ jobs.checks.outputs.build-number }}
      flutter-version:
        value: ${{ jobs.checks.outputs.flutter-version }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  checks:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      flutter-version: ${{ steps.version.outputs.flutter-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 校验版本并生成发布说明
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          bash scripts/prepare_release.sh "$RELEASE_TAG"
          echo "flutter-version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: python scripts/check_secrets.py --tracked
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: build/release-preview/notes.md
          if-no-files-found: error
          retention-days: 7
