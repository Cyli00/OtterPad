name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 静态分析 + 单元测试（最快，所有平台构建的前置门槛）──
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # ── Android APK ──
  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 仅产出 armeabi-v7a 与 arm64-v8a 两个 ABI 的拆分 APK
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  # ── Windows ──
  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # VS 2026/MSVC 14.51 把 <experimental/coroutine> 变为硬错误，
      # flutter_inappwebview_windows 0.6.0 仍依赖它，用该宏抑制静态断言
      - run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 7

  # ── Linux ──
  build-linux:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: build/linux/x64/release/bundle/
          retention-days: 7

  # ── macOS ──
  build-macos:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v6
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/*.app
          retention-days: 7
