name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 静态分析 + 单元测试（最快，所有平台构建的前置门槛）──
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # test/tools 是本机 PDF + 真实 LLM 的手工 demo，标了 tools tag，CI 不跑。
      - run: flutter test --exclude-tags tools

  # ── Android APK ──
  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 仅产出 armeabi-v7a 与 arm64-v8a 两个 ABI 的拆分 APK
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

