name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发=只构建打包、不发 Release，可用于演练

permissions:
  contents: write

jobs:
  # ── Android 构建并打包成可分发格式，统一命名后作为 artifact 上传 ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 从 tag 取版本号 (去掉前导 v)；手动触发时回退为 0.0.0-dev
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          v="${ref#v}"
          [ "$v" = "$ref" ] && v="0.0.0-dev"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Prepare dist dir
        shell: bash
        run: mkdir -p release-dist

      # ── Android：拆分 APK，直接 flutter build（命名确定，不走 distributor）──
      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Collect Android
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "release-dist/OtterPad-$v-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-dist/OtterPad-$v-android-armeabi-v7a.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: release-dist/
          retention-days: 3

  # ── 汇总所有产物 + 自动生成 changelog + 建 GitHub Release ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: release-dist

      - name: Generate release notes
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          sed "s|VERSION|$version|g" .github/release_template.md > notes.md
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          range="${prev:+$prev..}$tag"
          {
            git log --no-merges --pretty=format:'- %s' "$range" | grep -v 'Update changelog' || true
            echo
          } >> notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── iOS TestFlight（骨架，默认禁用）──
  # 启用条件：拥有 Apple Developer Program 账号($99/年)，并在仓库
  # Settings → Secrets and variables → Actions 配置以下 secrets，然后删除 `if: false`：
  #   BUILD_CERTIFICATE_BASE64      Apple Distribution 证书(.p12) 的 base64
  #   P12_PASSWORD                  .p12 密码
  #   PROVISIONING_PROFILE_BASE64   App Store 描述文件(.mobileprovision) 的 base64
  #   KEYCHAIN_PASSWORD             临时钥匙串密码(任意字符串)
  #   APPSTORE_ISSUER_ID            App Store Connect API Key 的 Issuer ID
  #   APPSTORE_KEY_ID               API Key ID
  #   APPSTORE_PRIVATE_KEY          API Key 私钥(.p8) 内容
  ios-testflight:
    if: false
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Import signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/app.keychain-db
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        run: flutter build ipa --release --export-method app-store

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/OtterPad.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
