name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发=只构建打包、不发 Release，可用于演练

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # ── 各平台并行构建并打包成可分发格式，统一命名后作为 artifact 上传 ──
  # fail-fast: false —— 单个平台失败不取消其余平台，一次看清全部问题。
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.checks.outputs.flutter-version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Prepare dist dir
        shell: bash
        run: mkdir -p release-dist

      # 恢复签名密钥（仓库 Settings → Secrets → Actions 需配置）：
      #   ANDROID_KEYSTORE_BASE64   release.jks 的 base64
      #   ANDROID_KEY_PROPERTIES    key.properties 内容（keyAlias/keyPassword/storePassword）
      - name: Restore Android signing keystore
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_PROPERTIES" ]]; then
            echo '缺少 Android 发布签名配置。' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties

      # ── Android：拆分 APK，直接 flutter build（命名确定，不走打包器）──
      - name: Build Android APKs
        if: matrix.platform == 'android'
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
          BUILD_NUMBER: ${{ needs.checks.outputs.build-number }}
        run: >-
          flutter build apk --release --no-pub --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
      - name: Collect Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          v="$RELEASE_VERSION"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "release-dist/OtterPad-$v-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-dist/OtterPad-$v-android-armeabi-v7a.apk"

      # ── 桌面端：fastforge ──
      # flutter_distributor 已废弃并由 fastforge 继任，配置格式相同，
      # 故 windows/packaging/exe 与 macos/packaging/dmg 下的 make_config.yaml 原样复用。
      # 版本号由 fastforge 直接读 pubspec.yaml，与 checks 校验过的 tag 一致。
      - name: Activate fastforge
        if: matrix.platform != 'android'
        run: dart pub global activate fastforge 0.6.12

      # Windows：Inno Setup 生成安装器；zip 为免安装便携版。
      # CL 宏用于压制 Flutter Windows 协程特性弃用告警；使用 -D 避免 Git Bash 将 /D 转成路径。
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y
          # Inno Setup 不内置简体中文；固定社区翻译版本，避免打包器静默跳过 zh。
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/1ff90acc4ed4aee82b1cda43253243deee3daed4/ChineseSimplified.isl \
            --output '/c/Program Files (x86)/Inno Setup 6/Languages/ChineseSimplified.isl'
      - name: Package Windows
        if: matrix.platform == 'windows'
        env:
          CL: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: dart pub global run fastforge:main package --platform windows --targets exe,zip --skip-clean
      - name: Collect Windows
        if: matrix.platform == 'windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
          BUILD_NUMBER: ${{ needs.checks.outputs.build-number }}
        run: |
          v="$RELEASE_VERSION"
          source="dist/$v+$BUILD_NUMBER/otter_pad-$v+$BUILD_NUMBER-windows"
          cp "$source-setup.exe" "release-dist/OtterPad-$v-windows-x64-setup.exe"
          cp "$source.zip" "release-dist/OtterPad-$v-windows-x64-portable.zip"

      # macOS：appdmg 生成带图标布局的 DMG。未做签名与公证，
      # 首次打开需用户在「系统设置 → 隐私与安全性」放行（见 docs/release.md）。
      - name: Install appdmg
        if: matrix.platform == 'macos'
        run: npm install -g appdmg
      - name: Package macOS
        if: matrix.platform == 'macos'
        env:
          # gal 的最低版本为 11.0；Flutter 将此设置同步到生成的 Swift Package。
          FLUTTER_XCODE_MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          test "$(uname -m)" = arm64
          dart pub global run fastforge:main package --platform macos --targets dmg --skip-clean
      - name: Collect macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
          BUILD_NUMBER: ${{ needs.checks.outputs.build-number }}
        run: |
          v="$RELEASE_VERSION"
          cp "dist/$v+$BUILD_NUMBER/otter_pad-$v+$BUILD_NUMBER-macos.dmg" "release-dist/OtterPad-$v-macos-arm64.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  # ── 汇总检查与构建产物后创建 GitHub Release ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-dist

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes/

      # 三个平台产物汇总到同一目录后再统一生成校验文件，
      # 避免各平台各自产出一份 SHA256SUMS 互相覆盖。
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-dist/*
          body_path: release-notes/notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── iOS TestFlight（骨架，默认禁用）──
  # 启用条件：拥有 Apple Developer Program 账号($99/年)，并在仓库
  # Settings → Secrets and variables → Actions 配置以下 secrets，然后删除 `if: false`：
  #   BUILD_CERTIFICATE_BASE64      Apple Distribution 证书(.p12) 的 base64
  #   P12_PASSWORD                  .p12 密码
  #   PROVISIONING_PROFILE_BASE64   App Store 描述文件(.mobileprovision) 的 base64
  #   KEYCHAIN_PASSWORD             临时钥匙串密码(任意字符串)
  #   APPSTORE_ISSUER_ID            App Store Connect API Key 的 Issuer ID
  #   APPSTORE_KEY_ID               API Key ID
  #   APPSTORE_PRIVATE_KEY          API Key 私钥(.p8) 内容
  ios-testflight:
    if: false
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Import signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/app.keychain-db
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        run: flutter build ipa --release --export-method app-store

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/OtterPad.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
