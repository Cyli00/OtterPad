name: otter_core
description: "Utility to build Rust code"
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  # hook/build.dart 打包锁定版本的 PDFium
  archive: ^4.6.0
  code_assets: ^2.1.0
  crypto: ^3.0.8
  hooks: ^2.2.0

dev_dependencies:
  ffi: ^2.0.2
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
